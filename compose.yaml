services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      YITU_DATABASE_URL: ${YITU_DATABASE_URL}
      YITU_REDIS_URL: ${YITU_REDIS_URL}
      YITU_APP_PROFILE: demo
    command: >-
      sh -c ".venv/bin/alembic upgrade head &&
      .venv/bin/uvicorn yitu.main:create_app --factory
      --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ./backend
    hostname: yitu-worker
    environment:
      YITU_DATABASE_URL: ${YITU_DATABASE_URL}
      YITU_REDIS_URL: ${YITU_REDIS_URL}
    command: >-
      .venv/bin/celery -A yitu.worker:celery_app worker
      --loglevel=INFO --hostname=worker@%h --beat
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", ".venv/bin/celery -A yitu.worker:celery_app inspect ping --destination worker@yitu-worker --timeout 3"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
