services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "55433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-yitu}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-yitu-minio-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ./backend
    environment:
      YITU_DATABASE_URL: ${YITU_DATABASE_URL}
      YITU_REDIS_URL: ${YITU_REDIS_URL}
      YITU_APP_PROFILE: demo
      YITU_KNOWLEDGE_STORAGE_BACKEND: ${YITU_KNOWLEDGE_STORAGE_BACKEND:-local}
      YITU_KNOWLEDGE_STORAGE_ROOT: /app/var/knowledge
      YITU_KNOWLEDGE_S3_ENDPOINT: ${YITU_KNOWLEDGE_S3_ENDPOINT}
      YITU_KNOWLEDGE_S3_BUCKET: ${YITU_KNOWLEDGE_S3_BUCKET}
      YITU_KNOWLEDGE_S3_REGION: ${YITU_KNOWLEDGE_S3_REGION}
      YITU_KNOWLEDGE_S3_ACCESS_KEY: ${YITU_KNOWLEDGE_S3_ACCESS_KEY}
      YITU_KNOWLEDGE_S3_SECRET_KEY: ${YITU_KNOWLEDGE_S3_SECRET_KEY}
      YITU_EMBEDDING_PROVIDER: ${YITU_EMBEDDING_PROVIDER}
      YITU_EMBEDDING_BASE_URL: ${YITU_EMBEDDING_BASE_URL}
      YITU_EMBEDDING_API_KEY: ${YITU_EMBEDDING_API_KEY}
      YITU_EMBEDDING_MODEL: ${YITU_EMBEDDING_MODEL}
      YITU_EMBEDDING_DIMENSION: ${YITU_EMBEDDING_DIMENSION:-1024}
      YITU_MINERU_BASE_URL: ${YITU_MINERU_BASE_URL}
      YITU_MINERU_TOKEN: ${YITU_MINERU_TOKEN}
      YITU_MINERU_MODEL_VERSION: ${YITU_MINERU_MODEL_VERSION}
    command: >-
      sh -c ".venv/bin/alembic upgrade head &&
      .venv/bin/uvicorn yitu.main:create_app --factory
      --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/var/knowledge:/app/var/knowledge
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ./backend
    hostname: yitu-worker
    environment:
      YITU_DATABASE_URL: ${YITU_DATABASE_URL}
      YITU_REDIS_URL: ${YITU_REDIS_URL}
      YITU_KNOWLEDGE_STORAGE_BACKEND: ${YITU_KNOWLEDGE_STORAGE_BACKEND:-local}
      YITU_KNOWLEDGE_STORAGE_ROOT: /app/var/knowledge
      YITU_KNOWLEDGE_S3_ENDPOINT: ${YITU_KNOWLEDGE_S3_ENDPOINT}
      YITU_KNOWLEDGE_S3_BUCKET: ${YITU_KNOWLEDGE_S3_BUCKET}
      YITU_KNOWLEDGE_S3_REGION: ${YITU_KNOWLEDGE_S3_REGION}
      YITU_KNOWLEDGE_S3_ACCESS_KEY: ${YITU_KNOWLEDGE_S3_ACCESS_KEY}
      YITU_KNOWLEDGE_S3_SECRET_KEY: ${YITU_KNOWLEDGE_S3_SECRET_KEY}
      YITU_EMBEDDING_PROVIDER: ${YITU_EMBEDDING_PROVIDER}
      YITU_EMBEDDING_BASE_URL: ${YITU_EMBEDDING_BASE_URL}
      YITU_EMBEDDING_API_KEY: ${YITU_EMBEDDING_API_KEY}
      YITU_EMBEDDING_MODEL: ${YITU_EMBEDDING_MODEL}
      YITU_EMBEDDING_DIMENSION: ${YITU_EMBEDDING_DIMENSION:-1024}
      YITU_MINERU_BASE_URL: ${YITU_MINERU_BASE_URL}
      YITU_MINERU_TOKEN: ${YITU_MINERU_TOKEN}
      YITU_MINERU_MODEL_VERSION: ${YITU_MINERU_MODEL_VERSION}
    command: >-
      .venv/bin/celery -A yitu.worker:celery_app worker
      --loglevel=INFO --hostname=worker@%h --beat
    volumes:
      - ./backend/var/knowledge:/app/var/knowledge
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", ".venv/bin/celery -A yitu.worker:celery_app inspect ping --destination worker@yitu-worker --timeout 3"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  minio_data:
