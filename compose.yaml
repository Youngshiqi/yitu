services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "55433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-yitu}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-yitu-minio-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ./backend
    environment:
      YITU_DATABASE_URL: ${YITU_DATABASE_URL}
      YITU_REDIS_URL: ${YITU_REDIS_URL}
      YITU_APP_PROFILE: demo
      YITU_KNOWLEDGE_STORAGE_BACKEND: local
      YITU_KNOWLEDGE_STORAGE_ROOT: /var/lib/yitu/knowledge
    command: >-
      sh -c ".venv/bin/alembic upgrade head &&
      .venv/bin/uvicorn yitu.main:create_app --factory
      --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - knowledge_data:/var/lib/yitu/knowledge
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ./backend
    hostname: yitu-worker
    environment:
      YITU_DATABASE_URL: ${YITU_DATABASE_URL}
      YITU_REDIS_URL: ${YITU_REDIS_URL}
      YITU_KNOWLEDGE_STORAGE_BACKEND: local
      YITU_KNOWLEDGE_STORAGE_ROOT: /var/lib/yitu/knowledge
    command: >-
      .venv/bin/celery -A yitu.worker:celery_app worker
      --loglevel=INFO --hostname=worker@%h --beat
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - knowledge_data:/var/lib/yitu/knowledge
    healthcheck:
      test:
        ["CMD-SHELL", ".venv/bin/celery -A yitu.worker:celery_app inspect ping --destination worker@yitu-worker --timeout 3"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  minio_data:
  knowledge_data:
