[project]
name = "yitu"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "boto3>=1.35,<2",
    "argon2-cffi>=23.1,<26",
    "celery[redis]>=5.4,<6",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jieba>=0.42.1,<1",
    "openai>=1.59,<3",
    "pgvector>=0.3,<1",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "PyJWT>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "tzdata>=2025.2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
